[alias]
maintain = "run --quiet --locked -p nia-maintain --"

# The maintained MSVC/LLVM configuration uses the static CRT.  Keep this in
# the repository so ordinary Cargo invocations have the same ABI as the C++
# LLVM bridge; Visual Studio still supplies LIB/INCLUDE and the linker tools.
# Use --target x86_64-pc-windows-msvc to keep these flags off host build scripts.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
# Link with the LLD that rustup ships rather than `link.exe`. Cargo runs one
# link per test binary in parallel, and each `link.exe` of an LLVM-linked test
# peaks near 1.7 GiB, so a workspace build could run a 16 GiB host out of
# memory; `rust-lld` peaks near 650 MiB and links in a fraction of the time.
# Visual Studio still supplies the Windows SDK and CRT libraries through LIB.
linker = "rust-lld"
