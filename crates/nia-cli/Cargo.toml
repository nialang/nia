[package]
name = "nia-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
perf-alloc = []
default = ["llvm-dynamic"]
llvm-dynamic = ["nia-build/llvm-dynamic", "nia-driver/llvm-dynamic"]
llvm-static = ["nia-build/llvm-static", "nia-driver/llvm-static"]

[dependencies]
nia-build = { workspace = true, default-features = false }
nia-compat.workspace = true
nia-driver = { workspace = true, default-features = false }
nia-ice.workspace = true
nia-loader-query.workspace = true
nia-linker.workspace = true
nia-source.workspace = true
nia-timing.workspace = true
nia-toolchain.workspace = true
nia-target-config.workspace = true

[dev-dependencies]
libc.workspace = true
nia-test-support.workspace = true

[[bin]]
name = "nia"
path = "src/main.rs"
