name: build-std correctness

on:
  pull_request:
    paths:
      - ".github/workflows/build-std.yml"
      - ".cargo/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "lib/**"
      - "examples/**"
      - "benchmarks/build/**"
      - "maintain/**"
      - "tools/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-std.yml"
      - ".cargo/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "lib/**"
      - "examples/**"
      - "benchmarks/build/**"
      - "maintain/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-std-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  correctness:
    name: Build/std correctness matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      LLVM_SYS_231_PREFIX: /usr/lib/llvm-23

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default stable

      - name: Report Rust toolchain identity
        run: |
          rustc --version --verbose
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Install LLVM 23.1 toolchain
        run: |
          sudo apt-get update
            sudo apt-get install --yes curl gnupg gcc-multilib g++-multilib libc6-dev-i386
          curl --fail --silent --show-error --location \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            --output "${RUNNER_TEMP}/llvm-snapshot.gpg.key"
          gpg --dearmor < "${RUNNER_TEMP}/llvm-snapshot.gpg.key" \
            | sudo tee /usr/share/keyrings/apt.llvm.org.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-23.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes llvm-23-dev libpolly-23-dev lld-23
          /usr/lib/llvm-23/bin/llvm-config --version

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: nia-build-std-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            nia-build-std-${{ runner.os }}-${{ runner.arch }}-

      - name: Check maintenance tooling
        run: cargo maintain check

      - name: Format and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Check portable 32-bit semantic owners
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check \
            -p nia-layout \
            -p nia-abi-check \
            -p nia-backend-ir \
            -p nia-target-config \
            --all-targets \
            --target wasm32-unknown-unknown

      - name: Check i686 workspace compilation
        run: |
          rustup target add i686-unknown-linux-gnu
          CC_i686_unknown_linux_gnu=gcc \
          CFLAGS_i686_unknown_linux_gnu=-m32 \
          cargo check \
            --workspace \
            --all-targets \
            --target i686-unknown-linux-gnu

      - name: Run build/std integration suites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/nia-suite-diagnostics

          run_with_diagnostics() {
            local label="$1"
            shift
            local log="target/nia-suite-diagnostics/${label}.log"
            local pid
            "$@" >"$log" 2>&1 &
            local pid=$!
            while kill -0 "$pid" 2>/dev/null; do
              echo "[$label] still running pid=$pid"
              {
                echo "timestamp=$(date --iso-8601=seconds) label=$label pid=$pid"
                ps -eLf
                echo '--- process tree ---'
                pstree -ap
                for nia_pid in $(pgrep -x nia || true); do
                  echo "--- nia pid=$nia_pid ---"
                  cat "/proc/$nia_pid/status" || true
                  ps -L -p "$nia_pid" -o pid,tid,stat,wchan:32,comm || true
                  for tid in $(ls "/proc/$nia_pid/task" 2>/dev/null || true); do
                    echo "thread=$tid wchan=$(cat "/proc/$nia_pid/task/$tid/wchan" 2>/dev/null || true)"
                    cat "/proc/$nia_pid/task/$tid/stack" 2>/dev/null || true
                  done
                done
              } > "target/nia-suite-diagnostics/${label}-process-state.txt"
              sleep 30
            done
            wait "$pid"
          }

          run_with_diagnostics build_cases \
            timeout --signal=TERM --kill-after=30s 15m \
              cargo test -p nia-cli --test build_cases --no-default-features -- --nocapture
          run_with_diagnostics toolchain_relocation \
            timeout --signal=TERM --kill-after=30s 15m \
              cargo test -p nia-cli --test toolchain_relocation --no-default-features -- --nocapture
          run_with_diagnostics commands \
            timeout --signal=TERM --kill-after=30s 15m \
              cargo test -p nia-cli --test commands --no-default-features -- --nocapture

      - name: Run workspace unit tests
        run: cargo test --workspace --lib --bins

      - name: Run default-feature configured build case with a hard timeout
        shell: bash
        env:
          NIA_BUILD_TRACE: "1"
          NIA_TEST_RESOURCE_TRACE: "1"
        run: |
          set -euo pipefail
          dump_process_state() {
            mkdir -p target/nia-timeout
            {
              date --iso-8601=seconds
              ps -eLf
              echo '--- pstree ---'
              pstree -ap
              for pid in $(pgrep -x nia || true); do
                echo "--- nia pid=$pid ---"
                cat "/proc/$pid/status" || true
                cat "/proc/$pid/wchan" || true
                ps -L -p "$pid" -o pid,tid,stat,wchan:32,comm || true
                for tid in $(ls "/proc/$pid/task" 2>/dev/null || true); do
                  echo "thread $tid wchan=$(cat "/proc/$pid/task/$tid/wchan" 2>/dev/null || true)"
                  cat "/proc/$pid/task/$tid/stack" 2>/dev/null || true
                done
              done
            } > target/nia-timeout/process-state.txt
          trap dump_process_state EXIT
          timeout --signal=TERM --kill-after=30s 10m \
            cargo test -p nia-cli --test build_cases configured_success -- --exact --nocapture

      - name: Build release compiler
        run: cargo build --release -p nia-cli

      - name: Run clean/warm/edit/corruption/failure build baseline
        run: |
          cargo maintain baseline build \
            --nia target/release/nia \
            --resource-root lib \
            --repetitions 1 \
            --timeout-seconds 600 \
            --output target/nia-build-baseline/hosted.json

      - name: Publish build/std evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nia-build-std-evidence
          path: |
            target/nia-build-baseline/hosted.json
            target/nia-timeout/process-state.txt
            target/nia-suite-diagnostics
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows x64 correctness matrix
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      LLVM_SOURCE_ROOT: ${{ github.workspace }}\target\llvm-source
      LLVM_BUILD_ROOT: ${{ github.workspace }}\target\llvm-static\build
      LLVM_INSTALL_ROOT: ${{ github.workspace }}\target\llvm-static\install
      LLVM_SYS_231_PREFIX: ${{ github.workspace }}\target\llvm-static\install

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default stable
          rustc --version --verbose
          cargo --version

      - name: Cache static LLVM prefix
        id: llvm-cache
        uses: actions/cache@v6
        with:
          path: target/llvm-static/install
          key: nia-llvm-23.1.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/llvm/build-static.ps1') }}

      - name: Build pinned static LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\tools\llvm\build-static.ps1

      - name: Configure MSVC, Windows SDK, LLVM, and static CRT
        shell: pwsh
        run: |
          . .\tools\windows-env.ps1
          @(
            "LLVM_SYS_231_PREFIX=$env:LLVM_SYS_231_PREFIX"
            "LIB=$env:LIB"
            "INCLUDE=$env:INCLUDE"
            "CFLAGS=$env:CFLAGS"
            "CXXFLAGS=$env:CXXFLAGS"
            "RUSTFLAGS=$env:RUSTFLAGS"
            "PATH=$env:PATH"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check maintenance tooling
        shell: pwsh
        run: cargo maintain check

      - name: Format and lint
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: Run Windows workspace tests
        shell: pwsh
        run: cargo test --workspace --no-default-features

      - name: Run Windows maintenance workflow contracts
        shell: pwsh
        run: cargo test -p nia-maintain --test workflow_contracts --no-default-features

      - name: Build Windows release compiler
        shell: pwsh
        run: |
          cargo build --release -p nia-cli --no-default-features
          & .\target\release\nia.exe --version
