name: build-std correctness

on:
  pull_request:
    paths:
      - ".github/workflows/build-std.yml"
      - ".cargo/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "lib/**"
      - "examples/**"
      - "benchmarks/build/**"
      - "maintain/**"
      - "tools/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-std.yml"
      - ".cargo/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "lib/**"
      - "examples/**"
      - "benchmarks/build/**"
      - "maintain/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-std-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  correctness:
    name: Build/std correctness matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      LLVM_SYS_231_PREFIX: /usr/lib/llvm-23

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default stable

      - name: Report Rust toolchain identity
        run: |
          rustc --version --verbose
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Install LLVM 23.1 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl gnupg gcc-multilib g++-multilib libc6-dev-i386 qemu-user-static
          curl --fail --silent --show-error --location \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            --output "${RUNNER_TEMP}/llvm-snapshot.gpg.key"
          gpg --dearmor < "${RUNNER_TEMP}/llvm-snapshot.gpg.key" \
            | sudo tee /usr/share/keyrings/apt.llvm.org.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-23.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes llvm-23-dev libpolly-23-dev lld-23 clang-23
          /usr/lib/llvm-23/bin/llvm-config --version
          # Executables link with LLD by default; apt installs its drivers here.
          echo "/usr/lib/llvm-23/bin" >> "${GITHUB_PATH}"

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: nia-build-std-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            nia-build-std-${{ runner.os }}-${{ runner.arch }}-

      - name: Check maintenance tooling
        run: cargo maintain check

      - name: Format and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Check portable 32-bit semantic owners
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check \
            -p nia-layout \
            -p nia-abi-check \
            -p nia-backend-ir \
            -p nia-target-config \
            --all-targets \
            --target wasm32-unknown-unknown

      - name: Check i686 workspace compilation
        run: |
          rustup target add i686-unknown-linux-gnu
          CC_i686_unknown_linux_gnu=gcc \
          CFLAGS_i686_unknown_linux_gnu=-m32 \
          cargo check \
            --workspace \
            --all-targets \
            --target i686-unknown-linux-gnu

      - name: Run build/std integration suites
        timeout-minutes: 30
        run: |
          cargo test -p nia-cli --test build_cases --no-default-features -- --nocapture
          cargo test -p nia-cli --test toolchain_relocation --no-default-features -- --nocapture
          cargo test -p nia-cli --test commands --no-default-features -- --nocapture

      - name: Run workspace tests
        timeout-minutes: 60
        run: cargo test --workspace

      - name: Build release compiler
        run: cargo build --release -p nia-cli

      - name: Cross-link Windows executables on Linux
        run: |
          mkdir -p target/cross-execution/windows
          for optimization in 0 2; do
            target/release/nia --resource-root lib --target x86_64-pc-windows-msvc \
              emit --exe "-O${optimization}" maintain/fixtures/cross-execution.nia \
              -o "target/cross-execution/windows/probe-O${optimization}.exe"
          done
          (cd target/cross-execution/windows && sha256sum probe-*.exe > SHA256SUMS)

      - name: Publish Linux-built Windows executables
        uses: actions/upload-artifact@v7
        with:
          name: nia-linux-built-windows
          path: target/cross-execution/windows
          if-no-files-found: error
          retention-days: 14

      - name: Run clean/warm/edit/corruption/failure build baseline
        run: |
          cargo maintain baseline build \
            --nia target/release/nia \
            --resource-root lib \
            --repetitions 1 \
            --timeout-seconds 600 \
            --output target/nia-build-baseline/hosted.json

      - name: Publish build/std evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nia-build-std-evidence
          path: target/nia-build-baseline/hosted.json
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows x64 correctness matrix
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      LLVM_SOURCE_ROOT: ${{ github.workspace }}\target\llvm-source
      LLVM_BUILD_ROOT: ${{ github.workspace }}\target\llvm-static\build
      LLVM_INSTALL_ROOT: ${{ github.workspace }}\target\llvm-static\install
      LLVM_SYS_231_PREFIX: ${{ github.workspace }}\target\llvm-static\install
      LLVM_ENABLE_PROJECTS: clang;lld

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default stable
          rustc --version --verbose
          cargo --version

      - name: Cache static LLVM prefix
        id: llvm-cache
        uses: actions/cache@v6
        with:
          path: target/llvm-static/install
          key: nia-llvm-23.1.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/llvm/build-static.ps1') }}

      - name: Build pinned static LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\tools\llvm\build-static.ps1

      - name: Configure MSVC, Windows SDK, LLVM, and static CRT
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsRoot = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $vsRoot) { throw 'Visual Studio with the x64 MSVC tools was not found.' }
          $vsDevCmd = Join-Path $vsRoot 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path $vsDevCmd)) { throw "VsDevCmd.bat was not found: $vsDevCmd" }
          $environment = & cmd.exe /d /c "`"$vsDevCmd`" -arch=x64 -host_arch=x64 && set"
          if ($LASTEXITCODE -ne 0) { throw 'Visual Studio developer environment initialization failed.' }
          foreach ($line in $environment) {
            if ($line -match '^(?<name>[^=]+)=(?<value>.*)$') {
              Set-Item -Path "Env:$($Matches.name)" -Value $Matches.value
            }
          }
          $env:LLVM_SYS_231_PREFIX = "$env:GITHUB_WORKSPACE\target\llvm-static\install"
          $env:Path = "$env:LLVM_SYS_231_PREFIX\bin;$env:Path"
          $env:CLANG = "$env:LLVM_SYS_231_PREFIX\bin\clang.exe"
          # Explicit --target on Cargo commands keeps the repository's static
          # CRT flags on target code rather than host build scripts. llvm-sys
          # otherwise treats Windows system import libraries as bundled static
          # archives and requires extra rustc search paths for the SDK.
          @(
            "LLVM_SYS_231_PREFIX=$env:LLVM_SYS_231_PREFIX"
            "CLANG=$env:CLANG"
            "LIB=$env:LIB"
            "INCLUDE=$env:INCLUDE"
            "PATH=$env:PATH"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check maintenance tooling
        shell: pwsh
        run: cargo maintain check

      - name: Format and lint
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --no-default-features --target x86_64-pc-windows-msvc -- -D warnings

      - name: Run Windows workspace tests
        shell: pwsh
        run: cargo test --workspace --no-default-features --target x86_64-pc-windows-msvc

      - name: Run Windows native backend diagnostic failures
        shell: pwsh
        run: cargo test -p nia-cli --test diagnostic_failures --no-default-features --target x86_64-pc-windows-msvc -- --nocapture

      - name: Run Windows maintenance workflow contracts
        shell: pwsh
        run: cargo test -p nia-maintain --test workflow_contracts --no-default-features --target x86_64-pc-windows-msvc

      - name: Build Windows release compiler
        shell: pwsh
        run: |
          cargo build --release -p nia-cli --no-default-features --target x86_64-pc-windows-msvc
          & .\target\x86_64-pc-windows-msvc\release\nia.exe --version

      - name: Cross-link Linux executables on Windows
        shell: pwsh
        run: |
          $destination = 'target/cross-execution/linux'
          New-Item -ItemType Directory -Force $destination | Out-Null
          foreach ($target in @('x86_64-unknown-linux', 'x86-unknown-linux', 'aarch64-unknown-linux')) {
            foreach ($optimization in @(0, 2)) {
              & .\target\x86_64-pc-windows-msvc\release\nia.exe --resource-root lib --target $target `
                emit --exe "-O$optimization" maintain/fixtures/cross-execution.nia `
                -o "$destination/probe-$target-O$optimization"
              if ($LASTEXITCODE -ne 0) { throw "cross-link failed: $target O$optimization" }
            }
          }
          Get-ChildItem "$destination/probe-*" | Sort-Object Name | ForEach-Object {
            $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          } | Set-Content -Encoding ascii "$destination/SHA256SUMS"

      - name: Publish Windows-built Linux executables
        uses: actions/upload-artifact@v7
        with:
          name: nia-windows-built-linux
          path: target/cross-execution/linux
          if-no-files-found: error
          retention-days: 14

  run-windows-cross:
    name: Run Linux-built Windows executables
    needs: correctness
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Download Linux-built Windows executables
        uses: actions/download-artifact@v8
        with:
          name: nia-linux-built-windows
          path: cross-execution

      - name: Verify and execute Windows artifacts
        shell: pwsh
        run: |
          $root = (Resolve-Path cross-execution).Path
          foreach ($optimization in @(0, 2)) {
            $name = "probe-O$optimization.exe"
            $executable = Join-Path $root $name
            $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $executable).Hash.ToLowerInvariant()
            if ((Get-Content "$root/SHA256SUMS") -notcontains "$digest  $name") {
              throw "artifact checksum mismatch: $name"
            }
            $stdout = Join-Path $root "$name.stdout"
            $stderr = Join-Path $root "$name.stderr"
            $process = Start-Process -FilePath $executable -PassThru -WindowStyle Hidden `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $process.WaitForExit(30000)) {
              $process.Kill($true)
              throw "artifact execution timed out: $name"
            }
            $process.WaitForExit()
            if ($process.ExitCode -ne 0) { throw "artifact exit code $($process.ExitCode): $name" }
            if ((Get-Content -Raw $stderr).Trim() -ne 'cross-execution-ok') {
              throw "unexpected artifact output: $name"
            }
            "commit=$env:GITHUB_SHA run_id=$env:GITHUB_RUN_ID job=$env:GITHUB_JOB target=x86_64-pc-windows-msvc optimization=O$optimization sha256=$digest exit=0" |
              Add-Content "$root/execution.txt"
          }

      - name: Publish Windows cross-execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nia-windows-cross-execution-evidence
          path: |
            cross-execution/execution.txt
            cross-execution/SHA256SUMS
            cross-execution/*.stdout
            cross-execution/*.stderr
          if-no-files-found: warn
          retention-days: 30

  run-linux-cross:
    name: Run Windows-built Linux executables
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install target execution support
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-user-static

      - name: Download Windows-built Linux executables
        uses: actions/download-artifact@v8
        with:
          name: nia-windows-built-linux
          path: cross-execution

      - name: Verify and execute Linux artifacts
        run: |
          cd cross-execution
          sha256sum --check SHA256SUMS
          for target in x86_64-unknown-linux x86-unknown-linux aarch64-unknown-linux; do
            for optimization in 0 2; do
              executable="probe-${target}-O${optimization}"
              chmod +x "${executable}"
              if test "${target}" = aarch64-unknown-linux; then
                timeout 30s qemu-aarch64-static "./${executable}" > "${executable}.stdout" 2> "${executable}.stderr"
              else
                timeout 30s "./${executable}" > "${executable}.stdout" 2> "${executable}.stderr"
              fi
              test "$(cat "${executable}.stderr")" = cross-execution-ok
              printf 'commit=%s run_id=%s job=%s target=%s optimization=O%s sha256=%s exit=0\n' \
                "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "${GITHUB_JOB}" "${target}" "${optimization}" \
                "$(sha256sum "${executable}" | cut -d ' ' -f 1)" \
                >> execution.txt
            done
          done

      - name: Publish Linux cross-execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nia-linux-cross-execution-evidence
          path: |
            cross-execution/execution.txt
            cross-execution/SHA256SUMS
            cross-execution/*.stdout
            cross-execution/*.stderr
          if-no-files-found: warn
          retention-days: 30
