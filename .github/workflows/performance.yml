name: performance

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  baseline:
    name: LLVM performance guard
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      LLVM_SYS_231_PREFIX: /usr/lib/llvm-23

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default stable

      - name: Report Rust toolchain identity
        run: |
          rustc --version --verbose
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Install LLVM 23.1 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl gnupg
          curl --fail --silent --show-error --location \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            --output "${RUNNER_TEMP}/llvm-snapshot.gpg.key"
          gpg --dearmor < "${RUNNER_TEMP}/llvm-snapshot.gpg.key" \
            | sudo tee /usr/share/keyrings/apt.llvm.org.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-23.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes llvm-23-dev lld-23
          /usr/lib/llvm-23/bin/llvm-config --version
          # Executables link with LLD by default; apt installs its drivers here.
          echo "/usr/lib/llvm-23/bin" >> "${GITHUB_PATH}"

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: nia-perf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            nia-perf-${{ runner.os }}-${{ runner.arch }}-

      - name: Check maintenance tooling
        run: cargo maintain check

      - name: Select comparison revision
        id: main_baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p target/nia-perf
          if test -z "${BASE_SHA}" \
            || test "${BASE_SHA}" = 0000000000000000000000000000000000000000; then
            BASE_SHA="$(git rev-parse --verify HEAD^ 2>/dev/null || true)"
          fi
          if test -z "${BASE_SHA}"; then
            echo "available=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          BASE_SHA="$(git rev-parse --verify "${BASE_SHA}^{commit}")"
          echo "revision=${BASE_SHA}" >> "${GITHUB_OUTPUT}"
          if ! git cat-file -e "${BASE_SHA}:.github/workflows/performance.yml"; then
            echo "available=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          baseline_source="${RUNNER_TEMP}/nia-perf-baseline-source"
          git worktree add --detach "${baseline_source}" "${BASE_SHA}"
          echo "source=${baseline_source}" >> "${GITHUB_OUTPUT}"
          echo "path=${GITHUB_WORKSPACE}/target/nia-perf/reference.json" >> "${GITHUB_OUTPUT}"
          echo "available=true" >> "${GITHUB_OUTPUT}"

      - name: Collect reference baseline on this runner
        if: steps.main_baseline.outputs.available == 'true'
        working-directory: ${{ steps.main_baseline.outputs.source }}
        run: |
          set -o pipefail
          cargo maintain baseline compiler \
            --repeat 3 \
            --runner-class github-hosted-ubuntu-24.04-x64 \
            --output "${{ steps.main_baseline.outputs.path }}" \
            2>&1 | tee "${GITHUB_WORKSPACE}/target/nia-perf/reference.log"

      - name: Collect candidate baseline
        run: |
          mkdir -p target/nia-perf
          set -o pipefail
          cargo maintain baseline compiler \
            --repeat 3 \
            --runner-class github-hosted-ubuntu-24.04-x64 \
            --output target/nia-perf/candidate.json \
            2>&1 | tee target/nia-perf/candidate.log

      - name: Compare with main baseline
        id: comparison
        if: steps.main_baseline.outputs.available == 'true'
        run: |
          set +e
          cargo maintain baseline compare \
            "${{ steps.main_baseline.outputs.path }}" \
            target/nia-perf/candidate.json \
            > target/nia-perf/comparison.json
          status=$?
          set -e
          cat target/nia-perf/comparison.json
          exit "${status}"

      - name: Record bootstrap notice
        if: steps.main_baseline.outputs.available != 'true'
        run: |
          echo "The comparison revision predates the performance harness."
          echo "This run records the first sample; later runs measure both revisions on one runner."

      - name: Summarize performance guard
        if: always()
        env:
          BASELINE_AVAILABLE: ${{ steps.main_baseline.outputs.available }}
          BASELINE_REVISION: ${{ steps.main_baseline.outputs.revision }}
          COMPARISON_OUTCOME: ${{ steps.comparison.outcome }}
        run: |
          {
            echo "## Nia performance guard"
            echo "- Candidate revision: \`${GITHUB_SHA}\`"
            echo "- Runner class: \`github-hosted-ubuntu-24.04-x64\`"
            if test -f target/nia-perf/candidate.json; then
              echo "- Candidate collected: \`true\`"
            else
              echo "- Candidate collected: \`false\`"
            fi
            if test "${BASELINE_AVAILABLE}" = true; then
              echo "- Comparison revision (same runner): \`${BASELINE_REVISION}\`"
            else
              echo "- Main baseline: bootstrap (revision predates harness)"
            fi
            if test -f target/nia-perf/comparison.json; then
              if test "${COMPARISON_OUTCOME}" = success; then
                comparison_passed=true
              else
                comparison_passed=false
              fi
              echo "- Comparison passed: \`${comparison_passed}\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Prepare trend artifact
        id: prepare
        if: always()
        run: |
          mkdir -p target/nia-perf/artifact
          if test -f target/nia-perf/candidate.json; then
            cp target/nia-perf/candidate.json target/nia-perf/artifact/baseline.json
            echo "candidate_available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "candidate_available=false" >> "${GITHUB_OUTPUT}"
          fi
          if test -f target/nia-perf/candidate.log; then
            cp target/nia-perf/candidate.log target/nia-perf/artifact/candidate.log
          fi
          if test -f target/nia-perf/comparison.json; then
            cp target/nia-perf/comparison.json target/nia-perf/artifact/comparison.json
          fi
          if test -f target/nia-perf/reference.json; then
            cp target/nia-perf/reference.json target/nia-perf/artifact/reference.json
          fi
          if test -f target/nia-perf/reference.log; then
            cp target/nia-perf/reference.log target/nia-perf/artifact/reference.log
          fi
          printf '%s\n' "${GITHUB_RUN_ID}" > target/nia-perf/artifact/run-id.txt
          printf '%s\n' "${GITHUB_SHA}" > target/nia-perf/artifact/revision.txt

      - name: Store rolling main-branch trend baseline
        if: always() && github.ref == 'refs/heads/main' && steps.prepare.outputs.candidate_available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nia-perf-baseline
          path: target/nia-perf/artifact
          if-no-files-found: error
          retention-days: 90

      - name: Store unpromoted candidate
        if: always() && (github.ref != 'refs/heads/main' || steps.prepare.outputs.candidate_available != 'true')
        uses: actions/upload-artifact@v7
        with:
          name: nia-perf-candidate
          path: target/nia-perf/artifact
          if-no-files-found: error
          retention-days: 14
