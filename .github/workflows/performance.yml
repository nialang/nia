name: performance

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  baseline:
    name: LLVM performance guard
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install maintenance Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install maintenance Node dependencies
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Report maintenance toolchain identity
        run: |
          python3 --version
          node --version
          npm --version

      - name: Install locked maintenance dependencies
        run: npm ci --prefix tools --ignore-scripts

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default stable

      - name: Report Rust toolchain identity
        run: |
          rustc --version --verbose
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Install LLVM 22.1 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl gnupg
          curl --fail --silent --show-error --location \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            --output "${RUNNER_TEMP}/llvm-snapshot.gpg.key"
          gpg --dearmor < "${RUNNER_TEMP}/llvm-snapshot.gpg.key" \
            | sudo tee /usr/share/keyrings/apt.llvm.org.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes llvm-22-dev lld-22
          /usr/lib/llvm-22/bin/llvm-config --version

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: nia-perf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            nia-perf-${{ runner.os }}-${{ runner.arch }}-

      - name: Check maintenance tooling
        run: python3 -m tools check

      - name: Download latest completed main baseline
        id: main_baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/nia-perf
          available=false
          if test "${GITHUB_EVENT_NAME}" = pull_request \
            && ! git cat-file -e "${BASE_SHA}:.github/workflows/performance.yml"; then
            run_ids=""
          else
            run_ids="$(
              gh run list \
                --repo "${GITHUB_REPOSITORY}" \
                --workflow performance.yml \
                --branch main \
                --status completed \
                --limit 20 \
                --json databaseId \
                --jq '.[].databaseId'
            )"
          fi
          while read -r run_id; do
            if test -z "${run_id}"; then
              continue
            fi
            artifact_name=nia-perf-baseline
            destination="target/nia-perf/main-${run_id}-${artifact_name}"
            if gh run download "${run_id}" \
              --repo "${GITHUB_REPOSITORY}" \
              --name "${artifact_name}" \
              --dir "${destination}" \
              && test -f "${destination}/baseline.json"; then
              echo "path=${destination}/baseline.json" >> "${GITHUB_OUTPUT}"
              echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
              echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
              available=true
              break
            fi
          done <<< "${run_ids}"
          echo "available=${available}" >> "${GITHUB_OUTPUT}"

      - name: Collect candidate baseline
        run: |
          mkdir -p target/nia-perf
          set -o pipefail
          python3 -m tools baseline compiler \
            --repeat 3 \
            --runner-class github-hosted-ubuntu-24.04-x64 \
            --output target/nia-perf/candidate.json \
            2>&1 | tee target/nia-perf/candidate.log

      - name: Compare with main baseline
        if: steps.main_baseline.outputs.available == 'true'
        run: |
          set +e
          python3 -m tools baseline compare \
            "${{ steps.main_baseline.outputs.path }}" \
            target/nia-perf/candidate.json \
            > target/nia-perf/comparison.json
          status=$?
          set -e
          cat target/nia-perf/comparison.json
          exit "${status}"

      - name: Record bootstrap notice
        if: steps.main_baseline.outputs.available != 'true'
        run: |
          echo "No completed main-branch performance sample is available yet."
          echo "This run bootstraps the controlled-runner baseline; later runs compare against it."

      - name: Summarize performance guard
        if: always()
        env:
          BASELINE_AVAILABLE: ${{ steps.main_baseline.outputs.available }}
          BASELINE_RUN_ID: ${{ steps.main_baseline.outputs.run_id }}
          BASELINE_ARTIFACT_NAME: ${{ steps.main_baseline.outputs.artifact_name }}
        run: |
          {
            echo "## Nia performance guard"
            echo "- Candidate revision: \`${GITHUB_SHA}\`"
            echo "- Runner class: \`github-hosted-ubuntu-24.04-x64\`"
            if test -f target/nia-perf/candidate.json; then
              echo "- Candidate collected: \`true\`"
            else
              echo "- Candidate collected: \`false\`"
            fi
            if test "${BASELINE_AVAILABLE}" = true; then
              echo "- Main baseline run: \`${BASELINE_RUN_ID}\`"
              echo "- Main baseline artifact: \`${BASELINE_ARTIFACT_NAME}\`"
            else
              echo "- Main baseline: bootstrap (no prior artifact)"
            fi
            if test -f target/nia-perf/comparison.json; then
              comparison_passed="$(
                python3 -c 'import json; print(str(json.load(open("target/nia-perf/comparison.json"))["passed"]).lower())'
              )"
              echo "- Comparison passed: \`${comparison_passed}\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Prepare trend artifact
        id: prepare
        if: always()
        run: |
          mkdir -p target/nia-perf/artifact
          if test -f target/nia-perf/candidate.json; then
            cp target/nia-perf/candidate.json target/nia-perf/artifact/baseline.json
            echo "candidate_available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "candidate_available=false" >> "${GITHUB_OUTPUT}"
          fi
          if test -f target/nia-perf/candidate.log; then
            cp target/nia-perf/candidate.log target/nia-perf/artifact/candidate.log
          fi
          if test -f target/nia-perf/comparison.json; then
            cp target/nia-perf/comparison.json target/nia-perf/artifact/comparison.json
          fi
          printf '%s\n' "${GITHUB_RUN_ID}" > target/nia-perf/artifact/run-id.txt
          printf '%s\n' "${GITHUB_SHA}" > target/nia-perf/artifact/revision.txt

      - name: Store rolling main-branch trend baseline
        if: always() && github.ref == 'refs/heads/main' && steps.prepare.outputs.candidate_available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nia-perf-baseline
          path: target/nia-perf/artifact
          if-no-files-found: error
          retention-days: 90

      - name: Store unpromoted candidate
        if: always() && (github.ref != 'refs/heads/main' || steps.prepare.outputs.candidate_available != 'true')
        uses: actions/upload-artifact@v7
        with:
          name: nia-perf-candidate
          path: target/nia-perf/artifact
          if-no-files-found: error
          retention-days: 14
