name: formal models

on:
  pull_request:
    paths:
      - ".github/workflows/formal.yml"
      - "formal/**"
      - "crates/nia-ast/src/**"
      - "crates/nia-body-check/src/**"
      - "crates/nia-ty/src/**"
      - "crates/nia-type-normalize/src/**"
      - "crates/nia-local-resolve/src/**"
      - "crates/nia-layout/src/**"
      - "crates/nia-monomorphize/src/**"
      - "crates/nia-backend-lower/src/**"
      - "crates/nia-driver/src/tests/const_generics.rs"
      - "crates/nia-const-check/src/**"
      - "crates/nia-const-ir/src/**"
      - "crates/nia-driver/src/tests/value_inference_matrix.rs"
      - "crates/nia-defs/src/**"
      - "crates/nia-imports/src/**"
      - "crates/nia-ids/src/**"
      - "crates/nia-compat/src/**"
      - "crates/nia-public-surface/src/**"
      - "crates/nia-loader-query/src/**"
      - "crates/nia-program-signatures/src/**"
      - "crates/nia-type-resolve/src/**"
      - "crates/nia-value-resolve/src/**"
      - "crates/nia-compiler-query/src/**"
      - "crates/nia-driver/src/tests/imports.rs"
      - "crates/nia-driver/src/tests/using.rs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/formal.yml"
      - "formal/**"
      - "crates/nia-ast/src/**"
      - "crates/nia-body-check/src/**"
      - "crates/nia-ty/src/**"
      - "crates/nia-type-normalize/src/**"
      - "crates/nia-local-resolve/src/**"
      - "crates/nia-layout/src/**"
      - "crates/nia-monomorphize/src/**"
      - "crates/nia-backend-lower/src/**"
      - "crates/nia-driver/src/tests/const_generics.rs"
      - "crates/nia-const-check/src/**"
      - "crates/nia-const-ir/src/**"
      - "crates/nia-driver/src/tests/value_inference_matrix.rs"
      - "crates/nia-defs/src/**"
      - "crates/nia-imports/src/**"
      - "crates/nia-ids/src/**"
      - "crates/nia-compat/src/**"
      - "crates/nia-public-surface/src/**"
      - "crates/nia-loader-query/src/**"
      - "crates/nia-program-signatures/src/**"
      - "crates/nia-type-resolve/src/**"
      - "crates/nia-value-resolve/src/**"
      - "crates/nia-compiler-query/src/**"
      - "crates/nia-driver/src/tests/imports.rs"
      - "crates/nia-driver/src/tests/using.rs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check formal models
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build the Lean package
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: true
          test: false
          lint: false
