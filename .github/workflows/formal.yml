name: formal models

on:
  pull_request:
    paths:
      - ".github/workflows/formal.yml"
      - "formal/**"
      - "crates/nia-ast/src/**"
      - "crates/nia-body-check/src/**"
      - "crates/nia-const-check/src/**"
      - "crates/nia-const-ir/src/**"
      - "crates/nia-driver/src/tests/value_inference_matrix.rs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/formal.yml"
      - "formal/**"
      - "crates/nia-ast/src/**"
      - "crates/nia-body-check/src/**"
      - "crates/nia-const-check/src/**"
      - "crates/nia-const-ir/src/**"
      - "crates/nia-driver/src/tests/value_inference_matrix.rs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check formal models
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build the Lean package
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: true
          test: false
          lint: false
