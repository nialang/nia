name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Linux x86_64 release package
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      LLVM_SYS_221_PREFIX: ${{ github.workspace }}/target/llvm-static/install

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust and build dependencies
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build gcc g++ make curl git

      - name: Validate formal release tag
        run: |
          version="$(cargo pkgid -p nia-cli | sed -n 's/.*#//p')"
          tag="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${tag}" || ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.0$ ]]; then
            echo "formal releases require a vX.Y.0 tag matching package version; got ${GITHUB_REF_NAME} for ${version}" >&2
            exit 1
          fi

      - name: Build pinned static LLVM
        run: tools/llvm/build-static.sh

      - name: Run release maintenance audit
        run: cargo maintain check

      - name: Build release archive
        run: tools/release/package.sh

      - name: Verify archive layout
        run: |
          archive="target/release-package/nia-$(cargo pkgid -p nia-cli | sed -n 's/.*#//p')-linux-x86_64.tar.gz"
          tar -tzf "${archive}" | grep -E '/(bin/nia|lib/toolchain.meta|libexec/ld.lld)$'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cargo pkgid -p nia-cli | sed -n 's/.*#//p')"
          tag="v${version}"
          gh release create "${tag}" \
            "target/release-package/nia-${version}-linux-x86_64.tar.gz" \
            "target/release-package/SHA256SUMS" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes
