name = "nia-formal"
defaultTargets = ["NiaFormal"]

# The model reads this manifest with `include_str`; declaring it as an input
# makes Lake rebuild the model when the manifest changes.
[[input_file]]
name = "valueInferenceMatrix"
path = "NiaFormal/value_inference_matrix.json"
text = true

[[input_file]]
name = "moduleVisibilityMatrix"
path = "NiaFormal/visibility_matrix.json"
text = true

[[input_file]]
name = "moduleValueTypesMatrix"
path = "NiaFormal/module_value_types_matrix.json"
text = true

[[input_file]]
name = "exportScopeMatrix"
path = "NiaFormal/export_scope_matrix.json"
text = true

[[lean_lib]]
name = "NiaFormal"
needs = ["valueInferenceMatrix", "moduleVisibilityMatrix", "moduleValueTypesMatrix", "exportScopeMatrix", "symbolicConstMatrix"]

[[input_file]]
name = "symbolicConstMatrix"
path = "NiaFormal/symbolic_const_matrix.json"
text = true
